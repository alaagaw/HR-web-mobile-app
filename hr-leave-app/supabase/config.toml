# Supabase project config for HR System.
#
# Used by `supabase config push` to sync settings to the linked hosted project.
# Every setting we care about is declared explicitly so the CLI doesn't fill
# missing fields with local defaults (which would overwrite Dashboard config).

project_id = "vwalbkxighagreetxczi"

[auth]
# Canonical app URL — drives {{ .SiteURL }} in all Supabase auth email
# templates. Cutover from gaw-hr.vercel.app to polytech-hr.com (apex +
# www, both DNS-mapped via Cloudflare to Vercel). The Vercel preview
# URL is kept in the allow-list so any in-flight emails still resolve.
site_url = "https://www.polytech-hr.com"
additional_redirect_urls = [
  "https://www.polytech-hr.com/**",
  "https://polytech-hr.com/**",
  "https://gaw-hr.vercel.app/**",
  "http://localhost:8081/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.recovery]
subject = "Welcome to Poly-Tech HR Management System — Set your password"
content_path = "./supabase/templates/recovery.html"
