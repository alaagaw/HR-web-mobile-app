<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; color: #0F172A;">
  <h2 style="color: #1E40AF; margin-top: 0;">Welcome to HR System!</h2>
  <p>Hi,</p>
  <p>You've been added as an employee by HR. Click the button below to set your password and sign in.</p>
  <p style="text-align: center; margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #2563EB; color: #ffffff; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 600;">
      Set Your Password
    </a>
  </p>
  <p style="font-size: 13px; color: #64748B;">
    Or copy this link:<br>
    <a href="{{ .ConfirmationURL }}" style="color: #2563EB; word-break: break-all;">{{ .ConfirmationURL }}</a>
  </p>
  <hr style="margin: 28px 0; border: none; border-top: 1px solid #E2E8F0;">
  <p style="font-size: 12px; color: #94A3B8;">
    If you didn't expect this email, you can safely ignore it.
  </p>
</div>
